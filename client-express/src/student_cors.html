<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生列表</title>
</head>

<body>
    <div>
        <div class="title">学生列表</div>
        <div class="thead" id="h">
            <div class="row bold">
                <div class="col">编号</div>
                <div class="col">姓名</div>
                <div class="col">性别</div>
                <div class="col">年龄</div>
            </div>
        </div>

        <div class="tbody">
        </div>
    </div>

    <template id="tp">
        <div class="row">
            <div class="col">xx</div>
            <div class="col">xx</div>
            <div class="col">xx</div>
            <div class="col">xx</div>
        </div>
    </template>

    <style>
        html,
        body {
            font-family: 华文行楷;
            font-size: 20px;
        }

        .title {
            margin-bottom: 10px;
            font-size: 30px;
            color: #333;
            text-align: center;
        }

        .row {
            background-color: #fff;
            display: flex;
            justify-content: center;
        }

        .col {
            border: 1px solid #f0f0f0;
            width: 15%;
            height: 35px;
            text-align: center;
            line-height: 35px;
        }

        .bold .col {
            background-color: #f1f1f1;
        }
    </style>

    <script>
        async function findStudents() {
            try {
                // const resp = await fetch('http://localhost:8080/api/students')
                const resp = await fetch('/api/students')
                const obj = await resp.json()

                // 显示数据
                const tbody = document.querySelector('.tbody')
                const tp = document.getElementById("tp")
                const row = tp.content
                const [col1, col2, col3, col4] = row.querySelectorAll('.col')
                for (const { id, name, sex, age } of obj.data) {
                    col1.textContent = id
                    col2.textContent = name
                    col3.textContent = sex
                    col4.textContent = age

                    // 复制元素
                    const newNode = document.importNode(row, true)
                    // 建立父子关系，左边父，右边子
                    tbody.appendChild(newNode)
                }
            } catch (e) {
                console.log(e)
            }
        }

        findStudents()
    </script>
</body>

</html>
